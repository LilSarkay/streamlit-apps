name: Force Streamlit Cloud Redeploy

on:
  push:
    branches:
      - testrepo
    paths:
      - 'main.py'

permissions:
  contents: write

jobs:
  redeploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Prepend dummy variable to main.py to trigger redeploy
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ts=$(date)
        echo "__updated__ = \"$ts\"" > updated_main.py
        cat main.py >> updated_main.py
        mv updated_main.py main.py
        git config --global user.name "streamlit-agent"
        git config --global user.email "streamlit-agent@example.com"
        git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}
        git add main.py
        git commit -m "Force Streamlit redeploy by updating __updated__"
        git push
