name: Force Streamlit Cloud Redeploy

on:
  push:
    branches:
      - testrepo
    paths:
      - 'main.py'

permissions:
  contents: write

jobs:
  redeploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Touch main.py to trigger Streamlit Cloud redeploy
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        ts=$(date)
        echo "# Updated at $ts" >> temp.txt
        cat main.py >> temp.txt
        mv temp.txt main.py
        git config --global user.name "streamlit-agent"
        git config --global user.email "streamlit-agent@example.com"
        git remote set-url origin https://x-access-token:${TOKEN}@github.com/${{ github.repository }}
        git add main.py
        git commit -m "Auto-touch main.py to trigger redeploy"
        git push
